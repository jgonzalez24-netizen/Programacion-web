<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzería El Buen Sabor - Contacto</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="contacto">
    <header class="encabezado">
      <h1 class="Melted-pizzeria">Contacto</h1>
      <nav id="enlaces" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="about.html">Más sobre nosotros</a></li>
          <li><a href="pizza-detail.html">Menú</a></li>
          <li><a href="order.html">Ordena ahora</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main class="work">
      <section>
        <h2>Visítanos</h2>

        <div class="ubicacion-pizza">
          <iframe class="mapa-pizzeria" title="Ubicación de la Pizzería El Buen Sabor" src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d440.9458775900663!2d-110.28034973176464!3d24.0720727229074!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x86afcd66129b8859%3A0xb9673eda7442038d!2sLa%20Buena%20Pizza!5e0!3m2!1ses!2smx!4v1790748950421!5m2!1ses!2smx" width="600" height="450" allowfullscreen="" loading="lazy"></iframe>

          <div class="fondo-restaurante"></div>
        </div>

        <address>
          <a href="https://www.google.com.mx/maps" target="_blank" rel="noopener">Ver en Google Maps</a><br>
          Puerto Escondido 274, 23088 La Paz, B.C.S.<br>
          Teléfono: +52 612 150 5972
        </address>
      </section>

      <section>
        <h2>Envíanos un mensaje</h2>

        <form class="formulario" action="contact.html" method="get">
          <fieldset>
            <p>
              <label for="correo">Email:</label><br>
              <input type="email" name="correo" id="correo" placeholder="Correo electrónico" required>
            </p>

            <p>
              <label for="nombre">Nombre:</label><br>
              <input type="text" id="nombre" name="nombre" required>
            </p>

            <p>
              <label for="mensaje">Mensaje:</label><br>
              <textarea id="mensaje" name="mensaje" rows="5" cols="35" required></textarea>
            </p>
          </fieldset>

          <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Reiniciar">
          </p>
        </form>
      </section>
    </main>

    <footer class="pie-pagina">
      <p>2026 Pizzería El Buen Sabor</p>
    </footer>
  </body>
</html>
